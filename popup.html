<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NPTEL Ease</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="desk">
      <header class="masthead">
        <img class="app-mark" src="assets/icon-32.png" alt="" aria-hidden="true">
        <div>
          <h1>NPTEL Ease</h1>
          <p>Practice question utilities</p>
        </div>
      </header>

      <section class="tool" aria-labelledby="images-title">
        <div class="section-heading">
          <div>
            <h2 id="images-title">Questions</h2>
            <p>Copy image-based or text-based questions.</p>
          </div>
          <span class="shortcut" aria-hidden="true">01</span>
        </div>
        <div class="actions">
          <button id="copy-images" type="button">
            <span>Copy images</span>
            <span class="arrow" aria-hidden="true">⌘C</span>
          </button>
          <button id="copy-text" class="secondary" type="button">
            <span>Copy text</span>
            <span class="arrow" aria-hidden="true">⌘T</span>
          </button>
        </div>
        <button id="ask-chatgpt" class="secondary follow-up" type="button" hidden>
          <span>Ask ChatGPT</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </section>

      <section class="tool" aria-labelledby="answers-title">
        <div class="section-heading">
          <div>
            <h2 id="answers-title">Answers</h2>
            <p>Fill single or multiple-choice questions in order.</p>
          </div>
          <span class="shortcut" aria-hidden="true">02</span>
        </div>
        <label for="answers">Answer sequence</label>
        <div class="input-wrap">
          <input id="answers" type="text" inputmode="text" autocomplete="off"
            spellcheck="false" placeholder="A, C, ACD, B" aria-describedby="answer-hint">
          <span id="answer-count">0</span>
        </div>
        <p class="hint" id="answer-hint">Separate questions with commas · combine choices as ACD</p>
        <div class="actions">
          <button id="fill-answers" type="button">
            <span>Fill answers</span>
            <span class="arrow" aria-hidden="true">↵</span>
          </button>
          <button id="clear-answers" class="secondary" type="button">
            <span>Clear answers</span>
          </button>
        </div>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <footer>Works on an open NPTEL practice-question page.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
